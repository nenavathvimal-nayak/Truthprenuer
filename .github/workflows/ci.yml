name: Truthprenuer Quality & Security CI

on:
  push:
    branches: [ main, master, staging, dev ]
  pull_request:
    branches: [ main, master, staging, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-ci:
    name: Flutter Mobile CI (Analyze & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Static Analysis (Fail on Warnings)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Execute Unit & Repository Tests
        run: flutter test --coverage

  backend-ci:
    name: FastAPI Backend CI (Security & Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Backend Pytest Suite
        run: |
          pytest tests/ -v --durations=10

  admin-panel-ci:
    name: React Admin Panel CI (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin_panel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./admin_panel/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Production Build
        run: npm run build
