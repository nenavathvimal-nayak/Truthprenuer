version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres_mock:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: truthprenuer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ../../DATABASE/SCHEMA/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
