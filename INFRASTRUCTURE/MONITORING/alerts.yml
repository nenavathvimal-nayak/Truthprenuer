groups:
  - name: truthprenuer_alerts
    rules:
      - alert: BackendHighLatency
        expr: http_request_duration_seconds{quantile="0.95"} > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency elevated above 500ms"

      - alert: BackendLivenessFailure
        expr: up{job="truthprenuer-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Truthprenuer backend is unreachable"

      - alert: BackendHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / (rate(http_requests_total[5m]) + 0.0001) > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx server error rate exceeds 1% of total traffic"

      - alert: DatabaseConnectionSaturation
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.85
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL active connection pool usage exceeds 85%"

      - alert: AdminAuthFailuresSpike
        expr: rate(admin_auth_failures_total[5m]) > 5
        for: 1m
        labels:
          severity: high
        annotations:
          summary: "Suspicious spike in unauthorized Admin API requests (> 5/min)"
